program: training/train.py
method: random
metric:
  name: best_val_accuracy
  goal: maximize
parameters:
  activation:
    values: [relu, sigmoid, tanh, silu, gelu]
  optimizer:
    values: [sgd, nesterov, adam, adagrad, rmsprop, nadam]
  batch_size:
    values: [32, 64, 128]
  learning_rate:
    values: [0.0001, 0.001, 0.01]
  epochs:
    values: [10, 20, 30]
  seed:
    value: 42
